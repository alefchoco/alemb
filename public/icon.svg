<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Negro OLED -->
  <rect width="512" height="512" fill="#000000" rx="80"/>
  
  <!-- Glow exterior verde -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Escudo principal con gradiente -->
  <g filter="url(#glow)">
    <!-- Escudo exterior -->
    <path d="M 256 80 
             L 140 140 
             L 140 280 
             Q 140 380 256 432 
             Q 372 380 372 280 
             L 372 140 
             Z" 
          fill="none" 
          stroke="url(#shieldGradient)" 
          stroke-width="14" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
    
    <!-- Relleno semi-transparente -->
    <path d="M 256 80 
             L 140 140 
             L 140 280 
             Q 140 380 256 432 
             Q 372 380 372 280 
             L 372 140 
             Z" 
          fill="rgba(34, 197, 94, 0.15)"/>
    
    <!-- Check mark con brillo -->
    <path d="M 190 256 
             L 230 296 
             L 322 204" 
          fill="none" 
          stroke="#22c55e" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Check mark brillante (capa superior) -->
    <path d="M 190 256 
             L 230 296 
             L 322 204" 
          fill="none" 
          stroke="#4ade80" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.8"/>
  </g>
  
  <!-- Detalles decorativos -->
  <!-- Línea superior del escudo -->
  <line x1="256" y1="80" x2="256" y2="100" 
        stroke="#22c55e" 
        stroke-width="6" 
        opacity="0.6"
        stroke-linecap="round"/>
  
  <!-- Partículas de energía -->
  <circle cx="180" cy="200" r="5" fill="#22c55e" opacity="0.8"/>
  <circle cx="332" cy="200" r="5" fill="#22c55e" opacity="0.8"/>
  <circle cx="256" cy="360" r="5" fill="#22c55e" opacity="0.8"/>
  <circle cx="200" cy="320" r="4" fill="#4ade80" opacity="0.6"/>
  <circle cx="312" cy="320" r="4" fill="#4ade80" opacity="0.6"/>
  
  <!-- Brillo central -->
  <circle cx="256" cy="256" r="100" fill="url(#shieldGradient)" opacity="0.05"/>
  
  <!-- Borde del canvas con esquinas redondeadas -->
  <rect width="512" height="512" rx="80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
