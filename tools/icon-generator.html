<!DOCTYPE html>
<html>
<head>
  <title>Convertir Icono Shield-Master 2026</title>
  <style>
    body {
      background: #000;
      color: #22c55e;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    canvas {
      border: 2px solid #22c55e;
      margin: 20px 0;
    }
    button {
      background: #22c55e;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin: 10px;
    }
    button:hover {
      background: #10b981;
    }
    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ Shield-Master 2026 Icon Generator</h1>
    <canvas id="canvas" width="512" height="512"></canvas>
    <div>
      <button onclick="download(256, 'icon-256.png')">Descargar 256x256 (PNG)</button>
      <button onclick="download(512, 'icon-512.png')">Descargar 512x512 (PNG)</button>
    </div>
    <div class="info">
      <p>Después de descargar, usa una herramienta online para convertir a .ico:</p>
      <p><strong>https://convertio.co/es/png-ico/</strong></p>
      <p>Configura: 256x256, 128x128, 64x64, 48x48, 32x32, 16x16</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Dibujar el icono del escudo con check
    function drawIcon() {
      // Fondo negro
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 512, 512);
      
      // Escudo exterior (verde neón)
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 16;
      ctx.lineJoin = 'round';
      
      ctx.beginPath();
      ctx.moveTo(256, 80);
      ctx.lineTo(140, 140);
      ctx.lineTo(140, 280);
      ctx.quadraticCurveTo(140, 380, 256, 432);
      ctx.quadraticCurveTo(372, 380, 372, 280);
      ctx.lineTo(372, 140);
      ctx.closePath();
      ctx.stroke();
      
      // Escudo interior (relleno semi-transparente)
      ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
      ctx.fill();
      
      // Check mark (verde neón brillante)
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 24;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      // Sombra del check (efecto glow)
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 20;
      
      ctx.beginPath();
      ctx.moveTo(190, 256);
      ctx.lineTo(230, 296);
      ctx.lineTo(322, 204);
      ctx.stroke();
      
      // Segundo trazo para más brillo
      ctx.shadowBlur = 30;
      ctx.stroke();
      
      // Reset shadow
      ctx.shadowBlur = 0;
    }
    
    function download(size, filename) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = size;
      tempCanvas.height = size;
      const tempCtx = tempCanvas.getContext('2d');
      
      tempCtx.drawImage(canvas, 0, 0, size, size);
      
      tempCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
    
    // Dibujar al cargar
    drawIcon();
  </script>
</body>
</html>
